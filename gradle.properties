org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache включим после того, как сборка стабильно зазеленеет
org.gradle.configuration-cache=false

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 по умолчанию компилирует Kotlin сам. Мы отключаем это и применяем
# org.jetbrains.kotlin.android явно: так версия Kotlin в libs.versions.toml
# согласована с compose-compiler и KSP, а не подтягивается из AGP.
android.builtInKotlin=false
