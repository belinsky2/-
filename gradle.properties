org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache включим после того, как сборка стабильно зазеленеет
org.gradle.configuration-cache=false

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 по умолчанию и компилирует Kotlin сам, и включает новый DSL.
# Мы применяем org.jetbrains.kotlin.android явно, чтобы версия Kotlin
# в libs.versions.toml была согласована с compose-compiler и KSP, а не
# подтягивалась из AGP. Плагин Kotlin несовместим с новым DSL, поэтому
# отключены обе опции.
#
# Это временная развилка: опции удалят в одной из следующих версий AGP.
# Переход на built-in Kotlin — отдельная задача, её нельзя делать
# одновременно с настройкой сборки: слишком много неизвестных сразу.
android.builtInKotlin=false
android.newDsl=false
