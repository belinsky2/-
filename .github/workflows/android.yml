name: android

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Не отменяем идущую сборку: Android локально не компилируется, и каждый
  # прогон — единственный источник правды о том, собирается ли этап.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # Доменная логика проверяется отдельно и первой: она не зависит от Android
      # и ломается содержательно, а не из-за окружения.
      # JVM-режим: доменные тесты не должны падать из-за конфигурации Android.
      # Если сломалась логика — видно сразу, а не через ошибку резолва плагина.
      - name: Domain and vault tests
        env:
          PUNCHLINE_JVM_ONLY: '1'
        run: ./gradlew :core:model:test :core:vault:test

      # Дешёвая проверка перед долгой сборкой: ловит импорты, оставшиеся
      # от переезда типа между модулями. Android локально не компилируется,
      # и без неё такая опечатка обнаруживается только здесь, через три минуты.
      - name: Import check
        run: python3 tools/check-imports.py

      - name: Static checks
        run: ./gradlew :app:checkNoHardcodedCyrillic

      # Ключ подписи один на всю жизнь приложения: Android принимает обновление
      # только от APK с тем же ключом, иначе переустановка с потерей данных.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PUNCHLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/punchline-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет PUNCHLINE_KEYSTORE_BASE64 не задан — APK выйдет неподписанным и не установится."
          fi

      # Debug-сборка подписывается ключом, который AGP генерирует сам,
      # и ставится без каких-либо секретов. Это отдельное приложение
      # (суффикс .debug), поэтому оно не конфликтует с релизным и не мешает
      # правилу «релиз подписан одним ключом на всю жизнь».
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: punchline-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        env:
          PUNCHLINE_KEYSTORE_FILE: punchline-release.jks
          PUNCHLINE_KEYSTORE_PASSWORD: ${{ secrets.PUNCHLINE_KEYSTORE_PASSWORD }}
          PUNCHLINE_KEY_ALIAS: ${{ secrets.PUNCHLINE_KEY_ALIAS }}
          PUNCHLINE_KEY_PASSWORD: ${{ secrets.PUNCHLINE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the artifact honestly
        id: name
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "artifact=punchline-release-apk" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=punchline-UNSIGNED-do-not-install" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Сборка «Панчлайн»"
            echo
            echo "**punchline-debug-apk** — ставится сразу, без секретов. Для проверки."
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "**punchline-release-apk** — подписан релизным ключом. Рабочая установка."
            else
              echo "Релизный APK не подписан и не установится. Чтобы получить рабочий,"
              echo "добавь секреты: \`PUNCHLINE_KEYSTORE_BASE64\`, \`PUNCHLINE_KEYSTORE_PASSWORD\`,"
              echo "\`PUNCHLINE_KEY_ALIAS\`, \`PUNCHLINE_KEY_PASSWORD\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
