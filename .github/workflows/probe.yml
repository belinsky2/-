name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner toolchain
        run: |
          echo "=== java ==="; java -version 2>&1
          echo "=== ANDROID_HOME=$ANDROID_HOME ==="
          ls "$ANDROID_HOME" || true
          echo "=== platforms ==="; ls "$ANDROID_HOME/platforms" || true
          echo "=== build-tools ==="; ls "$ANDROID_HOME/build-tools" || true
          echo "=== cmdline-tools ==="; ls "$ANDROID_HOME/cmdline-tools" || true

      - name: Latest versions from Google Maven and Maven Central
        run: |
          probe() {
            name="$1"; url="$2"
            echo "--- $name"
            curl -s --max-time 30 "$url" \
              | grep -o '<version>[^<]*</version>' \
              | sed 's/<[^>]*>//g' \
              | grep -viE 'alpha|beta|rc|dev' \
              | tail -5 | tr '\n' ' '
            echo
          }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          probe "AGP com.android.tools.build:gradle" "$G/com/android/tools/build/gradle/maven-metadata.xml"
          probe "room-runtime"                       "$G/androidx/room/room-runtime/maven-metadata.xml"
          probe "compose-bom"                        "$G/androidx/compose/compose-bom/maven-metadata.xml"
          probe "activity-compose"                   "$G/androidx/activity/activity-compose/maven-metadata.xml"
          probe "lifecycle-viewmodel-compose"        "$G/androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml"
          probe "navigation-compose"                 "$G/androidx/navigation/navigation-compose/maven-metadata.xml"
          probe "core-ktx"                           "$G/androidx/core/core-ktx/maven-metadata.xml"
          probe "datastore-preferences"              "$G/androidx/datastore/datastore-preferences/maven-metadata.xml"
          probe "work-runtime-ktx"                   "$G/androidx/work/work-runtime-ktx/maven-metadata.xml"
          probe "media3-exoplayer"                   "$G/androidx/media3/media3-exoplayer/maven-metadata.xml"
          probe "documentfile"                       "$G/androidx/documentfile/documentfile/maven-metadata.xml"
          probe "kotlin-gradle-plugin"               "$C/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml"
          probe "compose-compiler-gradle-plugin"     "$C/org/jetbrains/kotlin/compose-compiler-gradle-plugin/maven-metadata.xml"
          probe "ksp gradle plugin"                  "$C/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml"
          probe "kotlinx-coroutines-core"            "$C/org/jetbrains/kotlinx/kotlinx-coroutines-core/maven-metadata.xml"
          probe "kotlinx-serialization-json"         "$C/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml"
          probe "kotlinx-datetime"                   "$C/org/jetbrains/kotlinx/kotlinx-datetime/maven-metadata.xml"
