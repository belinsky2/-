name: web

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Тесты домена и архива
        run: npm test

      - name: Типы и сборка
        run: npm run build

      # Прогон сценария живёт и локально, и здесь: локально он ловит правки
      # сразу, здесь — гарантирует, что опубликовано только то, что прошло.
      - name: Установить браузер
        run: npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Прогон сценария
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://127.0.0.1:4173 -t 60000
          node tools/shots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: web/shots/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/claude/comedy-joke-app-kdwyxa'
        with:
          path: web/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/claude/comedy-joke-app-kdwyxa'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # enablement включает Pages в настройках репозитория само,
      # чтобы публикация не требовала ручного шага.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
